when:
  - event: [push, pull_request]

steps:
  - name: check
    image: oven/bun:alpine
    commands:
      - bun install --frozen-lockfile
      - bun run check

  - name: docker
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      dry-run: true
      repo: wissem-industries/parcourtime
      dockerfile: Dockerfile
    depends_on:
      - check
