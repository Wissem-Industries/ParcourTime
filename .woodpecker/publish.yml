depends_on: [check]
when:
  - event: tag
    ref: refs/tags/v*
concurrency:
  limit: 1
  group: production-parcourtime

steps:
  - name: deployment-start
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_PRODUCTION: "true"
      DEPLOYMENT_TASK: deploy:production
    commands:
      - bun .woodpecker/github-deployment.mjs start

  - name: verify-release
    image: oven/bun:alpine
    commands:
      - apk add --no-cache nodejs
      - bun install --frozen-lockfile
      - bun run check
      - test "v$(bun -p 'require("./package.json").version')" = "$${CI_COMMIT_TAG}"
    depends_on:
      - deployment-start

  - name: publish-image
    image: woodpeckerci/plugin-kaniko:2.3.2
    settings:
      registry: ghcr.io
      repo: wissem-industries/parcourtime
      username: WissemBad
      password:
        from_secret: github_packages_token
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      build_args:
        - IMAGE_VERSION=${CI_COMMIT_TAG}
    depends_on:
      - verify-release

  - name: deploy-production
    image: oven/bun:alpine
    environment:
      DOKPLOY_WEBHOOK_URL:
        from_secret: dokploy_webhook_url
    commands:
      - >-
        bun -e 'let error; for (let attempt = 0; attempt < 4; attempt++) { try { const response = await fetch(process.env.DOKPLOY_WEBHOOK_URL, { method: "POST", signal: AbortSignal.timeout(30000) }); if (response.ok) process.exit(0); error = new Error("Dokploy returned " + response.status) } catch (caught) { error = caught } await Bun.sleep(1000 * (attempt + 1)) } throw error'
    depends_on:
      - publish-image

  - name: verify-production
    image: oven/bun:alpine
    environment:
      PRODUCTION_URL: https://parcourtime.wissem.pro
    commands:
      - >-
        bun -e 'let error; for (let attempt = 0; attempt < 30; attempt++) { try { const response = await fetch(process.env.PRODUCTION_URL, { signal: AbortSignal.timeout(15000) }); if (response.ok) process.exit(0); error = new Error("Production returned " + response.status) } catch (caught) { error = caught } await Bun.sleep(10000) } throw error'
    depends_on:
      - deploy-production

  - name: create-release
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
    commands:
      - bun .woodpecker/github-deployment.mjs release
    depends_on:
      - verify-production

  - name: deployment-success
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_STATUS_DESCRIPTION: Déploiement Dokploy vérifié et release publiée
      DEPLOYMENT_URL: https://parcourtime.wissem.pro
    commands:
      - bun .woodpecker/github-deployment.mjs success
    depends_on:
      - create-release

  - name: deployment-failure
    image: oven/bun:alpine
    environment:
      GITHUB_PACKAGES_TOKEN:
        from_secret: github_packages_token
      DEPLOYMENT_STATUS_DESCRIPTION: Échec du pipeline de publication
    commands:
      - bun .woodpecker/github-deployment.mjs failure
    depends_on:
      - deployment-start
      - verify-release
      - publish-image
      - deploy-production
      - verify-production
      - create-release
      - deployment-success
    when:
      - status: [failure]
